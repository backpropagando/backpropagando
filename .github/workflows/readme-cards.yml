name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=backpropagando&show_icons=true&locale=es&rank_icon=github&bg_color=0E1015&title_color=FF5C23&text_color=C8F3FF&icon_color=FF5C23&border_color=2A3040&border_radius=6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=backpropagando&layout=compact&langs_count=6&locale=es&bg_color=0E1015&title_color=FF5C23&text_color=C8F3FF&border_color=2A3040&border_radius=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "backpropagando"
          git config user.email "backpropagando@gmail.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
